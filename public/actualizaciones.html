<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizaciones — DevLabs Team</title>
  <meta name="description" content="Actualizaciones de proyectos de DevLabs Team.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="tv-overlay" id="tv-overlay"></div>
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursor-follower"></div>
  <canvas id="grid-bg"></canvas>
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav__logo" data-transition="scanline">
      <span class="nav__logo-bracket">&lt;</span>DL<span class="nav__logo-bracket">/&gt;</span>
    </a>
    <div class="nav__links">
      <a href="index.html" class="nav__link" data-transition="scanline">Inicio</a>
      <a href="index.html#projects" class="nav__link" data-transition="scanline">Proyectos</a>
      <a href="actualizaciones.html" class="nav__link nav__link--active">Actualizaciones</a>
      <a href="anuncios.html" class="nav__link" data-transition="scanline">Anuncios</a>
      <a href="repositorios.html" class="nav__link" data-transition="glitch">Repositorios</a>
    </div>
    <div class="nav__actions">
      <div id="auth-nav"></div>
    </div>
  </nav>

  <main class="updates-page">
    <div class="updates-page__header">
      <a href="index.html" class="updates-page__back reveal-left" data-transition="scanline">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver al inicio
      </a>
      <h1 class="updates-page__title reveal-up">
        Actualizaciones
        <span class="updates-page__count" id="posts-count">0</span>
      </h1>
      <p class="updates-page__subtitle reveal-up" style="--delay:0.1s">
        Noticias y avances de los proyectos de DevLabs Team.
      </p>
    </div>

    <div class="updates__grid" id="posts-grid">
      <div class="post-card--loading reveal-up">
        <div class="skeleton skeleton--circle"></div>
        <div class="skeleton skeleton--line"></div>
        <div class="skeleton skeleton--line skeleton--short"></div>
      </div>
      <div class="post-card--loading reveal-up" style="--delay:0.1s">
        <div class="skeleton skeleton--circle"></div>
        <div class="skeleton skeleton--line"></div>
        <div class="skeleton skeleton--line skeleton--short"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer__divider"></div>
    <div class="footer__content">
      <div class="footer__logo"><span class="nav__logo-bracket">&lt;</span>DL<span class="nav__logo-bracket">/&gt;</span></div>
      <p class="footer__copy">&copy; 2026 DevLabs Team. Todos los derechos reservados.</p>
      <p class="footer__tagline">Hecho con &#9889; desde Espa&ntilde;a</p>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script>
  (function() {
    var grid = document.getElementById('posts-grid');
    var countEl = document.getElementById('posts-count');

    fetch('/api/posts').then(function(r){ return r.json(); }).then(function(posts) {
      if (!posts.length) {
        grid.innerHTML = '<div class="updates-empty reveal-up visible"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1"><path d="M19 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v1m2 13a2 2 0 0 1-2-2V7m2 13a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2m-4-3H9M7 16h6M7 12h10"/></svg><p>No hay actualizaciones a&uacute;n.</p></div>';
        if (countEl) countEl.textContent = '0';
        return;
      }
      if (countEl) countEl.textContent = posts.length;
      grid.innerHTML = posts.map(function(p, idx) {
        var date = new Date(p.createdAt).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' });
        var contentHtml = p.content.replace(/\n/g, '<br>');
        return '<article class="post-card reveal-up" data-idx="' + idx + '" role="button" tabindex="0" aria-label="Abrir: ' + p.title + '">' +
          '<div class="post-card__glow"></div>' +
          '<div class="post-card__header">' +
            '<img class="post-card__avatar" src="' + p.authorAvatar + '" alt="' + p.author + '">' +
            '<div class="post-card__meta">' +
              '<span class="post-card__author">@' + p.author + '</span>' +
              '<span class="post-card__date">' + date + '</span>' +
            '</div>' +
          '</div>' +
          (p.project ? '<div class="post-card__project"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg> ' + p.project + '</div>' : '') +
          '<h2 class="post-card__title">' + p.title + '</h2>' +
          '<div class="post-card__content post-card__content--preview">' + contentHtml + '</div>' +
          '<div class="post-card__footer">' +
            (p.repoUrl ? '<a href="' + p.repoUrl + '" target="_blank" class="post-card__link magnetic" data-strength="10" data-stop><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Ver repositorio</a>' : '') +
            '<span class="post-card__readmore"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Leer m&aacute;s</span>' +
          '</div>' +
        '</article>';
      }).join('');
      grid.querySelectorAll('.reveal-up').forEach(function(el) { el.classList.add('visible'); });
      grid.querySelectorAll('.post-card').forEach(function(card) {
        var post = posts[parseInt(card.dataset.idx)];
        var contentHtml = post.content.replace(/\n/g, '<br>');
        function openModal() {
          window.openNewsModal({
            tag: 'Actualizaci&oacute;n',
            tagColor: '#0066cc',
            author: post.author,
            avatar: post.authorAvatar,
            date: new Date(post.createdAt).toLocaleDateString('es-ES', { day:'numeric', month:'long', year:'numeric' }),
            project: post.project,
            title: post.title,
            content: contentHtml,
            link: post.repoUrl || ''
          });
        }
        card.addEventListener('click', function(e) {
          if (e.target.closest('[data-stop]')) return;
          openModal();
        });
        card.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
        });
      });
    }).catch(function() {
      grid.innerHTML = '<p class="repos-empty">Error al cargar actualizaciones.</p>';
    });
  })();
  </script>
</body>
</html>
