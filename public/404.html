<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — DevLabs Team</title>
  <meta name="description" content="Page not found — DevLabs Team">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .page-404 {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 2rem;
    }
    .page-404__code {
      font-family: var(--font-mono);
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 700;
      line-height: 1;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 1rem;
      position: relative;
      animation: glitchPulse 3s ease-in-out infinite;
    }
    .page-404__code::before,
    .page-404__code::after {
      content: '404';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      -webkit-text-fill-color: initial;
    }
    .page-404__code::before {
      color: #ff5f56;
      animation: glitchText1 2.5s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
      -webkit-text-fill-color: #ff5f56;
    }
    .page-404__code::after {
      color: #a855f7;
      animation: glitchText2 2.5s infinite;
      clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
      -webkit-text-fill-color: #a855f7;
    }
    @keyframes glitchPulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    @keyframes glitchText1 {
      0%,88%,100% { transform: translate(0); }
      90% { transform: translate(-4px, 2px); }
      92% { transform: translate(4px, -1px); }
      94% { transform: translate(-2px, 3px); }
    }
    @keyframes glitchText2 {
      0%,86%,100% { transform: translate(0); }
      88% { transform: translate(3px, -2px); }
      90% { transform: translate(-3px, 1px); }
      92% { transform: translate(2px, -3px); }
    }
    .page-404__title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }
    .page-404__text {
      font-size: 1rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      max-width: 400px;
      line-height: 1.7;
    }
    .page-404__glitch {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      padding: 1rem 1.5rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
    }
    .page-404__glitch span {
      color: #ff5f56;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor -->
  <div class="cursor" id="cursor"></div>
  <div class="cursor-follower" id="cursor-follower"></div>

  <!-- Background Canvas -->
  <canvas id="grid-bg"></canvas>

  <!-- Floating Orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <!-- 404 Content -->
  <div class="page-404">
    <div class="page-404__code">404</div>
    <h1 class="page-404__title">Page not found</h1>
    <p class="page-404__text">The route you are looking for does not exist or has been moved to another dimension.</p>
    <div class="page-404__glitch">
      <span>$</span> ERROR: ENOENT: no such file or directory<br>
      <span>$</span> Did you mean <a href="index.html" style="color:var(--accent);text-decoration:none;">index.html</a>?
    </div>
    <a href="index.html" class="btn btn--primary magnetic" data-strength="20" data-transition="tv">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
      Back to Home
    </a>
  </div>

  <script>
    (function() {

      // Custom cursor
      const cursor = document.getElementById('cursor');
      const follower = document.getElementById('cursor-follower');
      let mouseX = 0, mouseY = 0, cursorX = 0, cursorY = 0, followerX = 0, followerY = 0;
      document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
      function animate() {
        cursorX += (mouseX - cursorX) * 0.25;
        cursorY += (mouseY - cursorY) * 0.25;
        followerX += (mouseX - followerX) * 0.12;
        followerY += (mouseY - followerY) * 0.12;
        if (cursor) { cursor.style.left = cursorX + 'px'; cursor.style.top = cursorY + 'px'; }
        if (follower) { follower.style.left = followerX + 'px'; follower.style.top = followerY + 'px'; }
        requestAnimationFrame(animate);
      }
      animate();

      // Grid background
      const canvas = document.getElementById('grid-bg');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let w, h; const spacing = 55;
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        function draw() {
          ctx.clearRect(0, 0, w, h);
          ctx.strokeStyle = 'rgba(0, 240, 255, 0.025)';
          ctx.lineWidth = 0.5;
          for (let x = 0; x <= w; x += spacing) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
          for (let y = 0; y <= h; y += spacing) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
          requestAnimationFrame(draw);
        }
        resize(); draw(); window.addEventListener('resize', resize);
      }
    })();
  </script>
</body>
</html>
